<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,700;1,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
    <title>Apps Fly</title>
</head>
<body>
    <div class="big-container">
        <div class="middle-container">
            <!-- Styled examples (first 5) -->
            <div class="app-icon" data-app="chrome">
                <img src="/public/chrome.png" alt="Chrome">
                <span>Chrome</span>
            </div>
            <div class="app-icon" data-app="spotify">
                <img src="/public/spotify.png" alt="Spotify">
                <span>Spotify</span>
            </div>
            <div class="app-icon" data-app="netflix">
                <img src="/public/netflix.png" alt="Netflix">
                <span>Netflix</span>
            </div>
            <div class="app-icon" data-app="whatsapp">
                <img src="/public/whats-app.png" alt="WhatsApp">
                <span>WhatsApp</span>
            </div>
            <div class="app-icon" data-app="youtube">
                <img src="/public/youtube.png" alt="YouTube">
                <span>YouTube</span>
            </div>
            
            <!-- Original structure for remaining apps -->
            <p>Apple Store</p>
            <div label="name" class="panel">
                <img src="/public/apple-store.png" />
            </div>
            <p>Apple TV</p>
            <div label="name" class="panel">
                <img src="/public/apple-tv.png" />
            </div>
            <p>Camera</p>
            <div label="name" class="panel">
                <img src="/public/camera.png" />
            </div>
            <p>Clock</p>
            <div label="name" class="panel">
                <img src="/public/clock.png" />
            </div>
            <p>Cloud</p>
            <div label="name" class="panel">
                <img src="/public/cloud.png" />
            </div>
            <p>Facebook</p>
            <div label="name" class="panel">
                <img src="/public/facebook.png" />
            </div>
            <p>Files</p>
            <div label="name" class="panel">
                <img src="/public/files.png" />
            </div>
            <p>Google</p>
            <div class="panel">
                <img src="/public/google.png" />
            </div>
            <p>Messenger</p>
            <div label="name" class="panel">
                <img src="/public/messanger-fb.png" alt="">
            </div>
            <p>Message</p>
            <div label="name" class="panel">
                <img src="/public/messanger.png" />
            </div>
            <p>Notebook</p>
            <div label="name" class="panel">
                <img src="/public/notebook.png" />
            </div>
            <p>Phone</p>
            <div label="name" class="panel">
                <img src="/public/phone.png" />
            </div>
            <p>Photo</p>
            <div label="name" class="panel">
                <img src="/public/photo.png" />
            </div>
            <p>Safari</p>
            <div label="name" class="panel">
                <img src="/public/safari.png" />
            </div>
            <p>Twitter</p>
            <div label="name" class="panel">
                <img src="/public/twitter.png" />
            </div>
            <p>Video</p>
            <div label="name" class="panel">
                <img src="/public/video.png" />
            </div>
        </div>
    </div>
</body>
</html>
