<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,700;1,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
    <title>Apps Fly</title>
</head>
<body>
   
   
    
    
        <div class="ring-container">
            <div class="small-container"></div>
            <div class="center-text">
                <span class="default-text">Select an app</span>
                <span class="app-name" data-app="apple-store">Apple Store</span>
                <span class="app-name" data-app="apple-tv">Apple TV</span>
                <span class="app-name" data-app="camera">Camera</span>
                <span class="app-name" data-app="chrome">Chrome</span>
                <span class="app-name" data-app="clock">Clock</span>
                <span class="app-name" data-app="cloud">Cloud</span>
                <span class="app-name" data-app="facebook">Facebook</span>
                <span class="app-name" data-app="files">Files</span>
                <span class="app-name" data-app="google">Google</span>
                <span class="app-name" data-app="messenger">Messenger</span>
                <span class="app-name" data-app="message">Message</span>
                <span class="app-name" data-app="netflix">Netflix</span>
                <span class="app-name" data-app="notebook">Notebook</span>
                <span class="app-name" data-app="phone">Phone</span>
                <span class="app-name" data-app="photo">Photo</span>
                <span class="app-name" data-app="safari">Safari</span>
                <span class="app-name" data-app="spotify">Spotify</span>
                <span class="app-name" data-app="twitter">Twitter</span>
                <span class="app-name" data-app="video">Video</span>
                <span class="app-name" data-app="whatsapp">WhatsApp</span>
                <span class="app-name" data-app="youtube">YouTube</span>
            </div>
            
            <input type="radio" name="app" id="apple-store" class="app-radio">
            <label for="apple-store" class="panel">
                <img src="/public/apple-store.png" alt="Apple Store" />
            </label>
            
            <input type="radio" name="app" id="apple-tv" class="app-radio">
            <label for="apple-tv" class="panel">
                <img src="/public/apple-tv.png" alt="Apple TV" />
            </label>
            
            <input type="radio" name="app" id="camera" class="app-radio">
            <label for="camera" class="panel">
                <img src="/public/camera.png" alt="Camera" />
            </label>
            
            <input type="radio" name="app" id="chrome" class="app-radio">
            <label for="chrome" class="panel">
                <img src="/public/chrome.png" alt="Chrome" />
            </label>
            
            <input type="radio" name="app" id="clock" class="app-radio">
            <label for="clock" class="panel">
                <img src="/public/clock.png" alt="Clock" />
            </label>
            
            <input type="radio" name="app" id="cloud" class="app-radio">
            <label for="cloud" class="panel">
                <img src="/public/cloud.png" alt="Cloud" />
            </label>
            
            <input type="radio" name="app" id="facebook" class="app-radio">
            <label for="facebook" class="panel">
                <img src="/public/facebook.png" alt="Facebook" />
            </label>
            
            <input type="radio" name="app" id="files" class="app-radio">
            <label for="files" class="panel">
                <img src="/public/files.png" alt="Files" />
            </label>
            
            <input type="radio" name="app" id="google" class="app-radio">
            <label for="google" class="panel">
                <img src="/public/google.png" alt="Google" />
            </label>
            
            <input type="radio" name="app" id="messenger" class="app-radio">
            <label for="messenger" class="panel">
                <img src="/public/messanger-fb.png" alt="Messenger" />
            </label>
            
            <input type="radio" name="app" id="message" class="app-radio">
            <label for="message" class="panel">
                <img src="/public/messanger.png" alt="Message" />
            </label>
            
            <input type="radio" name="app" id="netflix" class="app-radio">
            <label for="netflix" class="panel">
                <img src="/public/netflix.png" alt="Netflix" />
            </label>
            
            <input type="radio" name="app" id="notebook" class="app-radio">
            <label for="notebook" class="panel">
                <img src="/public/notebook.png" alt="Notebook" />
            </label>
            
            <input type="radio" name="app" id="phone" class="app-radio">
            <label for="phone" class="panel">
                <img src="/public/phone.png" alt="Phone" />
            </label>
            
            <input type="radio" name="app" id="photo" class="app-radio">
            <label for="photo" class="panel">
                <img src="/public/photo.png" alt="Photo" />
            </label>
            
            <input type="radio" name="app" id="safari" class="app-radio">
            <label for="safari" class="panel">
                <img src="/public/safari.png" alt="Safari" />
            </label>
            
            <input type="radio" name="app" id="spotify" class="app-radio">
            <label for="spotify" class="panel">
                <img src="/public/spotify.png" alt="Spotify" />
            </label>
            
            <input type="radio" name="app" id="twitter" class="app-radio">
            <label for="twitter" class="panel">
                <img src="/public/twitter.png" alt="Twitter" />
            </label>
            
            <input type="radio" name="app" id="video" class="app-radio">
            <label for="video" class="panel">
                <img src="/public/video.png" alt="Video" />
            </label>
            
            <input type="radio" name="app" id="whatsapp" class="app-radio">
            <label for="whatsapp" class="panel">
                <img src="/public/whats-app.png" alt="WhatsApp" />
            </label>
            
            <input type="radio" name="app" id="youtube" class="app-radio">
            <label for="youtube" class="panel">
                <img src="/public/youtube.png" alt="YouTube" />
            </label>
        </div>

    
</body>
</html>
