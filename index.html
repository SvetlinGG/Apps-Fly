<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,700;1,700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:wght@500&display=swap" rel="stylesheet">
    <title>Apps Fly</title>
</head>
<body>
    <div class="desktop">
        <div class="desktop-icons">
            <div class="desktop-icon">
                <img src="/public/apple-store.png" alt="Apple Store">
                <span>Apple Store</span>
            </div>
            <div class="desktop-icon">
                <img src="/public/apple-tv.png" alt="Apple TV">
                <span>Apple TV</span>
            </div>
            <div class="desktop-icon">
                <img src="/public/camera.png" alt="Camera">
                <span>Camera</span>
            </div>
            <div class="desktop-icon">
                <img src="/public/clock.png" alt="Clock">
                <span>Clock</span>
            </div>
            <div class="desktop-icon">
                <img src="/public/facebook.png" alt="Facebook">
                <span>Facebook</span>
            </div>
            <div class="desktop-icon">
                <img src="/public/files.png" alt="Files">
                <span>Files</span>
            </div>
        </div>
        
        <div class="big-container">
            <div class="middle-container">
                <div class="app-icon">
                    <img src="/public/chrome.png" alt="Chrome">
                    <span>Chrome</span>
                </div>
                <div class="app-icon">
                    <img src="/public/spotify.png" alt="Spotify">
                    <span>Spotify</span>
                </div>
                <div class="app-icon">
                    <img src="/public/netflix.png" alt="Netflix">
                    <span>Netflix</span>
                </div>
                <div class="app-icon">
                    <img src="/public/whats-app.png" alt="WhatsApp">
                    <span>WhatsApp</span>
                </div>
                <div class="app-icon">
                    <img src="/public/youtube.png" alt="YouTube">
                    <span>YouTube</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
